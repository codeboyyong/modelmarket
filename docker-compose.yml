# docker run -d --name local_postgres -e POSTGRES_DB=model_market -e POSTGRES_USER=model_market -e POSTGRES_PASSWORD=model_market -p 5432:5432 -v postgres-data:/var/lib/postgresql/data --health-cmd "pg_isready -U model_market -d model_market" --health-interval 5s --health-timeout 3s --health-retries 20 postgres:16-alpine
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: model_market
      POSTGRES_USER: model_market
      POSTGRES_PASSWORD: model_market
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U model_market -d model_market"]
      interval: 5s
      timeout: 3s
      retries: 20
  # redis:
  #   image: redis:7-alpine
  #   profiles:
  #     - redis
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MM_APP_ENV: "dev"
      HTTP_ADDR: ":8080"
      MM_DB_DRIVER: "postgres"
      MM_DB_HOST: "postgres"
      MM_DB_PORT: "5432"
      MM_DB_NAME: "model_market"
      MM_DB_USER: "model_market"
      MM_DB_PASSWORD: "model_market"
      MM_DB_SSL_MODE: "disable"
      REDIS_ENABLED: "false"
      REDIS_ADDR: "redis:6379"
      DEV_MODE: "true"
      OBJECT_STORAGE_DIR: "/tmp/model-market-storage"
      MM_ASSET_PUBLIC_URL: "http://localhost:8080/api/v1/mock-s3"
      LOG_LEVEL: "info"
      PUBLIC_URL: "http://localhost:3000"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
