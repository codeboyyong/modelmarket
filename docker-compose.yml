services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: model_market
      POSTGRES_USER: model_market
      POSTGRES_PASSWORD: model_market
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U model_market -d model_market"]
      interval: 5s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: "postgres://model_market:model_market@postgres:5432/model_market?sslmode=disable"
      REDIS_ADDR: "redis:6379"
      DEV_MODE: "true"
      MOCK_DATA_DIR: "mock-data"
      MIGRATIONS_DIR: "backend/migrations"
      OBJECT_STORAGE_DIR: "/app/storage"
      LOG_LEVEL: "info"
      PUBLIC_URL: "http://localhost:3000"
    volumes:
      - asset-storage:/app/storage
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
  asset-storage:
