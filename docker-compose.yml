# docker run -d --name local_postgres -e POSTGRES_DB=model_market -e POSTGRES_USER=model_market -e POSTGRES_PASSWORD=model_market -p 5432:5432 -v postgres-data:/var/lib/postgresql/data --health-cmd "pg_isready -U model_market -d model_market" --health-interval 5s --health-timeout 3s --health-retries 20 postgres:16-alpine
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: model_market
      POSTGRES_USER: model_market
      POSTGRES_PASSWORD: model_market
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U model_market -d model_market"]
      interval: 5s
      timeout: 3s
      retries: 20
  # redis:
  #   image: redis:7-alpine
  #   profiles:
  #     - redis
  #   ports:
  #     - "6379:6379"
  #   healthcheck:
  #     test: ["CMD", "redis-cli", "ping"]
  #     interval: 5s
  #     timeout: 3s
  #     retries: 20

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      MM_APP_ENV: "dev"
      HTTP_ADDR: ":8080"
      MM_DB_DRIVER: "postgres"
      MM_DB_HOST: "postgres"
      MM_DB_PORT: "5432"
      MM_DB_NAME: "model_market"
      MM_DB_USER: "model_market"
      MM_DB_PASSWORD: "model_market"
      MM_DB_SSL_MODE: "disable"
      REDIS_ENABLED: "false"
      REDIS_ADDR: "redis:6379"
      DEV_MODE: "true"
      OBJECT_STORAGE_DIR: "/tmp/model-market-storage"
      # An explicitly empty value enables private S3/MinIO presigned GET URLs.
      # The `-` form preserves an empty value; `:-` would replace it with the
      # local mock URL.
      MM_ASSET_PUBLIC_URL: "${MM_ASSET_PUBLIC_URL-http://localhost:8080/api/v1/mock-s3}"
      LOG_LEVEL: "info"
      PUBLIC_URL: "http://localhost:3000"
      OPENAI_API_KEY: "${OPENAI_API_KEY:-}"
      GOOGLE_CLIENT_ID: "${GOOGLE_CLIENT_ID:-}"
      GOOGLE_CLIENT_SECRET: "${GOOGLE_CLIENT_SECRET:-}"
      GOOGLE_REDIRECT_URI: "${GOOGLE_REDIRECT_URI:-}"
      FACEBOOK_CLIENT_ID: "${FACEBOOK_CLIENT_ID:-}"
      FACEBOOK_CLIENT_SECRET: "${FACEBOOK_CLIENT_SECRET:-}"
      FACEBOOK_REDIRECT_URI: "${FACEBOOK_REDIRECT_URI:-}"
      FACEBOOK_GRAPH_API_VERSION: "${FACEBOOK_GRAPH_API_VERSION:-v23.0}"
      PAYMENT_PROVIDER_MODE: "${PAYMENT_PROVIDER_MODE:-mock}"
      STRIPE_SECRET_KEY: "${STRIPE_SECRET_KEY:-}"
      STRIPE_WEBHOOK_SECRET: "${STRIPE_WEBHOOK_SECRET:-}"
      OBJECT_STORAGE_PROVIDER: "${OBJECT_STORAGE_PROVIDER:-local}"
      MM_ASSET_BUCKET: "${MM_ASSET_BUCKET:-model-market-dev-assets}"
      AWS_ACCESS_KEY_ID: "${AWS_ACCESS_KEY_ID:-}"
      AWS_SECRET_ACCESS_KEY: "${AWS_SECRET_ACCESS_KEY:-}"
      AWS_SESSION_TOKEN: "${AWS_SESSION_TOKEN:-}"
      AWS_REGION: "${AWS_REGION:-us-east-1}"
      S3_ENDPOINT_URL: "${S3_ENDPOINT_URL:-}"
      S3_FORCE_PATH_STYLE: "${S3_FORCE_PATH_STYLE:-false}"
      S3_PRESIGN_MINUTES: "${S3_PRESIGN_MINUTES:-15}"
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/healthz"]
      interval: 10s
      timeout: 3s
      retries: 10

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    environment:
      PORT: "3000"
    ports:
      - "3000:3000"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres-data:
